<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #334155;
      background: #f8fafc;
    }
    .header {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #0f172a;
    }
    .group {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .group-title {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      background: #fff;
      outline: none;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 140px;
    }
    input[type="range"] {
      flex: 1;
    }
    .slider-val {
      font-variant-numeric: tabular-nums;
      width: 38px;
      text-align: right;
      font-size: 12px;
      color: #64748b;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #cbd5e1;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0284c7;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <div class="header">⚙️ Schedule.is 设置</div>

  <div class="group">
    <div class="group-title">外观与布局</div>
    <div class="row">
      <span>预设位置</span>
      <select id="setting-position">
        <option value="pos-bottom-center">底部居中</option>
        <option value="pos-top-center">顶部居中</option>
        <option value="pos-bottom-left">左下角</option>
        <option value="pos-bottom-right">右下角</option>
        <option value="pos-top-left">左上角</option>
        <option value="pos-top-right">右上角</option>
      </select>
    </div>
    <div class="row">
      <span>色彩主题</span>
      <select id="setting-theme">
        <option value="dark">黑夜（暗色毛玻璃）</option>
        <option value="light">白昼（浅色亮透）</option>
      </select>
    </div>
    <div class="row">
      <span>组件缩放</span>
      <div class="slider-wrap">
        <input type="range" id="setting-scale" min="60" max="160" step="5">
        <span class="slider-val" id="scale-val">100%</span>
      </div>
    </div>
  </div>

  <div class="group">
    <div class="group-title">显示内容</div>
    <div class="row">
      <span>当前课程</span>
      <label class="switch">
        <input type="checkbox" id="setting-show-current">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>下一节课程</span>
      <label class="switch">
        <input type="checkbox" id="setting-show-next">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>时间进度条</span>
      <label class="switch">
        <input type="checkbox" id="setting-show-progress">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span>当天完整课表</span>
      <label class="switch">
        <input type="checkbox" id="setting-show-full-schedule">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
